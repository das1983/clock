<!DOCTYPE html>
<html>

<body onload="startTime()">

<style>

@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600&display=swap');

body{
  background: #000;
  min-height: 100vh; /* ensures body takes full viewport height */
  width: 95vw;
  display: flex;
  justify-content: center;
  align-items: center;
}

.clock-container {
  position: relative;
  display: inline-flex;
  flex-direction: column;
  align-items: center;
}

.clock{
  color: #88CCFF;
  font-family: 'Orbitron', sans-serif;
  font-size: 10rem;
  letter-spacing: 1rem;
  font-weight: bold;
  transform: scaleY(1.3);
}

.date-display {
  color: #88CCFF;
  font-family: 'Orbitron', sans-serif;
  font-size: 2.5rem;
  letter-spacing: 0.25rem;
  font-weight: bold;
  margin-bottom: 0.1rem;
  transform: scaleY(1.3);
}
</style>

<div class="clock-container" id="container">
  <div class="date-display" id="dateDisplay"></div>
  <div class="clock" id="txt"></div>
</div>

<script>
const MONTHS = ['Jan','Feb','Mar','Apr','Maj','Jun','Jul','Aug','Sep','Okt','Nov','Dec'];
const DAYS = ['söndag','måndag','tisdag','onsdag','torsdag','fredag','lördag'];

let currentTemp = null;

async function fetchTemperature() {
  const API_URL = 'https://api.met.no/weatherapi/locationforecast/2.0/compact?lat=59.3326&lon=18.0649';
  try {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 10000);
    const response = await fetch(API_URL, { signal: controller.signal, cache: 'no-cache' });
    clearTimeout(timer);
    if (!response.ok) throw new Error('HTTP ' + response.status);
    const data = await response.json();
    currentTemp = data.properties.timeseries[0].data.instant.details.air_temperature;
  } catch (e) {
    // keep previous value on error
  }
  // refresh every ~60 min with a small random offset
  setTimeout(fetchTemperature, 60 * 60 * 1000 + Math.random() * 5 * 60 * 1000);
}

fetchTemperature();

function getWeekNumber(d) {
  const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = date.getUTCDay() || 7;
  date.setUTCDate(date.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
  return Math.ceil((((date - yearStart) / 86400000) + 1) / 7);
}

function startTime() {
  const today = new Date();
  let h = today.getHours();
  let m = today.getMinutes();
  let s = today.getSeconds();
  m = checkTime(m);
  s = checkTime(s);
  document.getElementById('txt').innerHTML = h + ":" + m + ":" + s;

  const day = today.getDate();
  const monthIndex = today.getMonth() + 1;
  const specialMessages = {
    "11-9":  "Teodor namnsdag!",
    "7-12":  "Eldar namnsdag!",
    "1-5":   "Hanna namnsdag!",
    "10-15": "Hedwig namnsdag!",
    "2-28":  "Maria namnsdag!"
  };
  const specialKey = monthIndex + "-" + day;
  const specialMessage = specialMessages[specialKey];

  let dateText;
  if (specialMessage) {
    dateText = specialMessage;
  } else {
    const weekday = DAYS[today.getDay()];
    const month = MONTHS[today.getMonth()];
    const week = getWeekNumber(today);
    const tempStr = currentTemp !== null ? ' | ' + currentTemp + ' °C' : '';
    dateText = weekday + " " + day + " " + month + " v" + week + tempStr;
  }
  document.getElementById('dateDisplay').innerHTML = dateText;

  // Generate random numbers between 1 and 10 for both x and y
  let randomX = Math.floor(Math.random() * 10) + 30;
  let randomY = Math.floor(Math.random() * 10) + 1;

  // Set the new position using style properties
  const container = document.getElementById('container');
  container.style.left = randomX + "px";
  container.style.top = randomY + "px";
  setTimeout(startTime, 1000);
}

function checkTime(i) {
  if (i < 10) {i = "0" + i};  // add zero in front of numbers < 10
  return i;
}
</script>

</body>
</html>
